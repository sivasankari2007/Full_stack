<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Information</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #333;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        #userContainer {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .user-card {
            background-color: white;
            width: 280px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            text-align: left;
        }

        .user-card h2 {
            color: #333;
        }

        .user-card p {
            margin: 8px 0;
        }

        .error {
            color: red;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>User Information</h1>

    <button id="loadUsers">Load Users</button>

    <div id="userContainer"></div>

    <script src="script.js"></script>

</body>
</html>
