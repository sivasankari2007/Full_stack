<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 500px;
            max-width: 95%;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .expense {
            display: flex;
            gap: 5px;
        }

        .expense input,
        .expense select {
            width: 50%;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #eef7ff;
            border-radius: 8px;
        }

        .result h2 {
            text-align: center;
        }

        .category {
            padding: 5px;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Personal Expense Calculator</h1>

    <label>Monthly Income (₹)</label>
    <input type="number" id="income" placeholder="Enter your income">

    <h3>Expense Details</h3>

    <div id="expenseList">

        <div class="expense">
            <input type="text" class="expenseName" placeholder="Expense name">

            <input type="number" class="expenseAmount" placeholder="Amount">

            <select class="expenseCategory">
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Education">Education</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
            </select>
        </div>

    </div>

    <button onclick="addExpense()">+ Add Expense</button>

    <button onclick="calculate()">Calculate</button>

    <div class="result" id="result">
        <h2>Summary Report</h2>
        <p>Total Income: ₹0</p>
        <p>Total Expenses: ₹0</p>
        <p>Savings: ₹0</p>
    </div>

</div>

<script>

    function addExpense() {

        let div = document.createElement("div");

        div.className = "expense";

        div.innerHTML = `
            <input type="text" class="expenseName" placeholder="Expense name">

            <input type="number" class="expenseAmount" placeholder="Amount">

            <select class="expenseCategory">
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Education">Education</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
            </select>
        `;

        document.getElementById("expenseList").appendChild(div);
    }


    function calculate() {

        let income = Number(document.getElementById("income").value);

        let amounts = document.querySelectorAll(".expenseAmount");
        let categories = document.querySelectorAll(".expenseCategory");

        let totalExpenses = 0;

        let categoryTotal = {
            Food: 0,
            Travel: 0,
            Education: 0,
            Shopping: 0,
            Bills: 0,
            Other: 0
        };

        for (let i = 0; i < amounts.length; i++) {

            let amount = Number(amounts[i].value);
            let category = categories[i].value;

            totalExpenses += amount;

            categoryTotal[category] += amount;
        }

        let savings = income - totalExpenses;

        let report = `
            <h2>Summary Report</h2>

            <p><b>Total Income:</b> ₹${income}</p>

            <p><b>Total Expenses:</b> ₹${totalExpenses}</p>

            <p><b>Savings:</b> ₹${savings}</p>

            <h3>Expense Categories</h3>

            <div class="category">Food: ₹${categoryTotal.Food}</div>
            <div class="category">Travel: ₹${categoryTotal.Travel}</div>
            <div class="category">Education: ₹${categoryTotal.Education}</div>
            <div class="category">Shopping: ₹${categoryTotal.Shopping}</div>
            <div class="category">Bills: ₹${categoryTotal.Bills}</div>
            <div class="category">Other: ₹${categoryTotal.Other}</div>
        `;

        document.getElementById("result").innerHTML = report;
    }

</script>

</body>
</html>
